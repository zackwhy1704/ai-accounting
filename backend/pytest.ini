[pytest]
# Put the backend dir (where the `app` package lives) on sys.path so
# `from app...` resolves regardless of how pytest is invoked. Without this,
# CI failed at conftest import time with ModuleNotFoundError: No module named
# 'app' (locally it only worked by accident of the rootdir landing on the path).
pythonpath = .

# Tests declare `pytestmark = pytest.mark.asyncio` per module; strict mode makes
# a missing/misapplied async marker an error instead of a silent skip.
asyncio_mode = strict

testpaths = tests
