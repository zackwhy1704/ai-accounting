name: CI

# Runs the full test suite + build on every push and PR. Crucially this gives
# the DB-dependent tests (especially test_schema_parity.py, which catches
# "model added but migration forgotten" — the bug that 500'd Bank Reconciliation
# in prod) a real Postgres so they actually RUN instead of self-skipping.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Throwaway Postgres for this job only. Matches the app's default
    # DATABASE_URL (postgres:postgres@localhost:5432/ai_account).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_account
        ports:
          - 5432:5432
        # Wait until Postgres is actually accepting connections before tests run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The test engine + alembic both read this. asyncpg for the app, alembic
      # strips +asyncpg to the sync driver itself.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_account

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.4"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run migrations (creates the schema the tests seed into)
        run: alembic upgrade head

      - name: Run test suite
        # -p no:randomly keeps order stable; -rs shows why anything skipped so a
        # silently-skipped guard can't hide.
        run: pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Type-check + build (strict gate)
        run: npm run build
